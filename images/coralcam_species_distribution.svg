<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1226 650" role="img" aria-labelledby="title description">
  <title id="title">Overall CoralCam species distribution</title>
  <desc id="description">An ethogram-style hierarchy and logarithmic bar chart show that CoralCam detection boxes comprise 14.30 percent bi-color damselfish, 11.52 percent bluehead wrasse, and 74.18 percent brown chromis.</desc>
  <rect width="1226" height="820" fill="#fff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="310" fill="#111" font-size="36" font-weight="700" text-anchor="middle" transform="rotate(-90 60 310)">CoralCam Detections</text>

    <g fill="none" stroke="#111" stroke-linecap="square" stroke-width="3">
      <line x1="95" y1="145" x2="95" y2="475"/>
      <line x1="95" y1="145" x2="122" y2="145"/>
      <line x1="95" y1="310" x2="122" y2="310"/>
      <line x1="95" y1="475" x2="122" y2="475"/>
      <line x1="365" y1="145" x2="405" y2="145"/>
      <line x1="365" y1="310" x2="405" y2="310"/>
      <line x1="365" y1="475" x2="405" y2="475"/>
    </g>

    <g font-size="27" font-weight="700" text-anchor="middle">
      <rect x="122" y="105" width="243" height="80" rx="6" fill="#ed4b3e"/>
      <text x="243.5" y="137" fill="#fff"><tspan x="243.5">Bi-color</tspan><tspan x="243.5" dy="31">Damselfish</tspan></text>

      <rect x="122" y="270" width="243" height="80" rx="6" fill="#3187bd"/>
      <text x="243.5" y="302" fill="#fff"><tspan x="243.5">Bluehead</tspan><tspan x="243.5" dy="31">Wrasse</tspan></text>

      <rect x="122" y="435" width="243" height="80" rx="6" fill="#8d6e63"/>
      <text x="243.5" y="467" fill="#fff"><tspan x="243.5">Brown</tspan><tspan x="243.5" dy="31">Chromis</tspan></text>

    </g>

    <g fill="#111" font-size="24">
      <text x="420" y="153">3,263 boxes</text>
      <text x="420" y="318">2,627 boxes</text>
      <text x="420" y="483">16,921 boxes</text>
    </g>

    <g>
      <rect x="685" y="115" width="323" height="60" fill="#ed4b3e"/>
      <rect x="685" y="280" width="309" height="60" fill="#3187bd"/>
      <rect x="685" y="445" width="431" height="60" fill="#8d6e63"/>
    </g>

    <g fill="#111" font-size="24" font-weight="700">
      <text x="1019" y="154">14.30%</text>
      <text x="1005" y="319">11.52%</text>
      <text x="1127" y="484">74.18%</text>
    </g>

    <g fill="none" stroke="#111" stroke-width="2.5">
      <line x1="685" y1="70" x2="685" y2="540"/>
      <line x1="685" y1="540" x2="1170" y2="540"/>
      <line x1="766" y1="540" x2="766" y2="556"/>
      <line x1="928" y1="540" x2="928" y2="556"/>
      <line x1="1090" y1="540" x2="1090" y2="556"/>
    </g>

    <g fill="#111" font-size="27" text-anchor="middle">
      <text x="766" y="591">10⁻¹</text>
      <text x="928" y="591">10⁰</text>
      <text x="1090" y="591">10¹</text>
      <text x="928" y="638" font-size="30">Frequency (% of Boxes)</text>
    </g>
  </g>
</svg>
